name: PR checks

# Runs on every pull request and on main. Branch protection on main requires
# the "checks" job to pass before a pull request can be merged, so a change
# that doesn't typecheck, lint, pass tests or build never reaches the live
# site (and through it, every installed phone).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint (errors fail, warnings are reported)
        run: npx eslint .

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
