<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChiChat API reference</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="https://www.chichatapp.com/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.0/swagger-ui.css">
  <style>
    body { margin: 0; background: #fff; }
    .note { margin: 0; padding: 10px 16px; font: 14px/1.4 system-ui, sans-serif; background: #E3F4EC; color: #0E5A40; }
  </style>
</head>
<body>
  <!--
    Swagger UI for docs/openapi.yaml (public build, internal endpoints removed).
    openapi.yaml next to this file is generated by `npm run api:bundle`; it is
    not committed. "Try it out" is off because the only environment is
    production: add ?try=1 to the address to turn it on for a test account.
  -->
  <p class="note">ChiChat API reference. Every endpoint here is the live production backend; test only with a test account.</p>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.0/swagger-ui-bundle.js"></script>
  <script>
    var tryItOut = new URLSearchParams(location.search).get("try") === "1";
    window.ui = SwaggerUIBundle({
      url: "openapi.yaml",
      dom_id: "#swagger-ui",
      deepLinking: true,
      docExpansion: "list",
      defaultModelsExpandDepth: 0,
      displayOperationId: true,
      persistAuthorization: false,
      supportedSubmitMethods: tryItOut ? ["get", "post"] : [],
    });
  </script>
</body>
</html>
